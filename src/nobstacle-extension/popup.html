<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
        }
        
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
        }
        
        p {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .status {
            padding: 10px;
            border-radius: 6px;
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: 500;
            text-align: center;
            margin: 15px 0;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        .link {
            text-align: center;
            margin-top: 15px;
        }
        
        .link a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
        }
        
        .link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h2>🚀 Nobstacle Header</h2>
    
    <div class="status">
        ✓ Active on all pages
    </div>
    
    <p>Your Nobstacle header is now displayed at the top of every webpage you visit.</p>
    
    <button id="openDashboard">Open Dashboard</button>
    
    <div class="link">
        <a href="https://nobstacle.com" target="_blank">Visit Nobstacle.com</a>
    </div>
    
    <!-- External script instead of inline -->
    <script src="popup.js"></script>
</body>
</html>
